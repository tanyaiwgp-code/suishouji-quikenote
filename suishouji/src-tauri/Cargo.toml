[package]
name = "suishouji"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "suishouji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 门禁：cargo clippy -- -D warnings 即把 clippy::all 的 warn 提升为 error（CI 与 pre-commit 强制零警告）
[lints.clippy]
all = "warn"

[dependencies]
# M4：tray-icon 启用系统托盘（feature 门控）；image-png/ico 供 default_window_icon 解码
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
# M5：系统文件对话框（open 导入 DOCX / save 导出 DOCX）
tauri-plugin-dialog = "2"
# M5：DOCX 处理（zip 容器 + roxmltree 只读 XML 解析，防 XXE）
zip = "2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "6"
base64 = "0.22"
# ts-rs：从 Rust 模型生成 TS 类型（types.gen.ts），消除前后端手写镜像漂移。
# 需普通依赖（非 dev），因 #[derive(TS)] 在 lib 源码内展开需 trait 可见。
# default feature 含 serde-compat（读取 #[serde(rename_all)]）。release 构建中运行时代码会被消除。
ts-rs = "12"

